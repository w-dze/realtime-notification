# Local full stack: Kafka (KRaft) + Redis (allkeys-lru) + api + worker + subscriber-stub
# From repo root:
#   docker compose -f deploy/docker/docker-compose.yml up --build
name: realtime-notification

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: user.activity
      # Tuned default: 6 partitions. Swap to 3 for A/B (see scripts/load/TUNING.md)
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      KAFKA_REPLICATION: 1
    volumes:
      - ./seed-topic.sh:/seed-topic.sh:ro
    entrypoint: ["/bin/bash", "/seed-topic.sh"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    # Portfolio knob: allkeys-lru eviction under memory pressure
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PREFS_TTL_SECONDS: 300
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notification-workers
      REDIS_URL: redis://redis:6379
      API_NOTIFY_URL: http://api:3000/internal/notify
      NOTIFY_IDEMPOTENCY: "true"
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  subscriber-stub:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.subscriber-stub
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: downstream-analytics
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
