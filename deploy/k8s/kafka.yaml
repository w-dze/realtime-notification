# Single-node KRaft Kafka for demo clusters (not HA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: realtime-notification
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.realtime-notification.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka.realtime-notification.svc.cluster.local:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: realtime-notification
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: realtime-notification
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: apache/kafka:3.8.1
          envFrom:
            - configMapRef:
                name: notification-config
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BROKERS="${KAFKA_BROKERS}"
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKERS" --list >/dev/null 2>&1 && break
                sleep 2
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKERS" \
                --create --if-not-exists \
                --topic "${KAFKA_TOPIC}" \
                --partitions "${KAFKA_PARTITIONS}" \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKERS" --describe --topic "${KAFKA_TOPIC}"
