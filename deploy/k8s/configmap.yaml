apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: realtime-notification
data:
  KAFKA_BROKERS: "kafka.realtime-notification.svc.cluster.local:9092"
  REDIS_URL: "redis://redis.realtime-notification.svc.cluster.local:6379"
  PREFS_TTL_SECONDS: "300"
  API_NOTIFY_URL: "http://notification-api.realtime-notification.svc.cluster.local:3000/internal/notify"
  NOTIFY_IDEMPOTENCY: "true"
  KAFKA_TOPIC: "user.activity"
  KAFKA_PARTITIONS: "6"
---
# Placeholder secrets — replace in real deploys (out of scope: secrets manager / CI).
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: realtime-notification
type: Opaque
stringData:
  DEMO_INTERNAL_TOKEN: "demo-only-replace-me"
