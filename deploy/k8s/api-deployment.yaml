apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: realtime-notification
  labels:
    app: notification-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
        - name: api
          # Build locally / push to your registry; placeholder tag for demo manifests
          image: realtime-notification/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: realtime-notification
  labels:
    app: notification-api
spec:
  type: NodePort
  selector:
    app: notification-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      # Stable node port for ALB target group (Terraform)
      nodePort: 30080
